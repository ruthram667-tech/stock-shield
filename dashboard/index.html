<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockShield — Command Center</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0B0F17;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ── Intro overlay ─────────────────────────────────────────────────────── */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #intro video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* hide all native browser controls + volume slider */
      pointer-events: none;
    }

    /* Fade-out animation triggered by JS */
    #intro.fade-out {
      animation: fadeOut 0.9s ease forwards;
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; visibility: hidden; }
    }

    /* ── Main dashboard iframe ─────────────────────────────────────────────── */
    #dashboard-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.9s ease;
      background: #0B0F17;
    }
    #dashboard-frame.visible {
      opacity: 1;
    }

    /* ── Loading spinner (shown while iframe loads) ────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B0F17;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #loader.visible { opacity: 1; pointer-events: auto; }

    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(0,229,255,0.15);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      color: #94A3B8;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .loader-logo {
      font-size: 2.2rem;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- ── INTRO VIDEO OVERLAY ─────────────────────────────────────────────── -->
  <div id="intro">
    <video
      id="intro-video"
      src="static/intro-clean.mp4"
      autoplay
      muted
      playsinline
      preload="auto"
      disablePictureInPicture
      controlsList="nodownload nofullscreen noremoteplayback noplaybackrate"
    ></video>
  </div>

  <!-- ── LOADING SPINNER (while Streamlit boots) ────────────────────────── -->
  <div id="loader">
    <div class="loader-logo">🛡️</div>
    <div class="spinner"></div>
    <div class="loader-text">Connecting to Command Center…</div>
  </div>

  <!-- ── MAIN DASHBOARD ─────────────────────────────────────────────────── -->
  <iframe
    id="dashboard-frame"
    src="http://localhost:8501"
    title="StockShield Command Center"
    allow="autoplay"
  ></iframe>

  <script>
    const video  = document.getElementById('intro-video');
    const intro  = document.getElementById('intro');
    const frame  = document.getElementById('dashboard-frame');
    const loader = document.getElementById('loader');

    // Ensure no volume UI leaks through — force mute programmatically too
    video.volume = 0;
    video.muted  = true;

    function revealDashboard() {
      intro.classList.add('fade-out');

      // Show loader while iframe finishes loading
      loader.classList.add('visible');

      setTimeout(() => {
        intro.style.display = 'none';
      }, 950);

      // Wait for iframe to be interactive
      frame.addEventListener('load', () => {
        loader.classList.remove('visible');
        frame.classList.add('visible');
      }, { once: true });

      // Fallback: show frame after 4s even if load event doesn't fire
      setTimeout(() => {
        loader.classList.remove('visible');
        frame.classList.add('visible');
      }, 4000);
    }

    // Transition when video ends naturally
    video.addEventListener('ended', revealDashboard);

    // Fallback: if video can't play (policy), skip after 500ms
    video.addEventListener('error', () => setTimeout(revealDashboard, 500));

    // Force play on load (handles strict autoplay policies)
    video.addEventListener('canplay', () => {
      video.play().catch(() => setTimeout(revealDashboard, 500));
    });
  </script>
</body>
</html>
