server:
  port: 8080

spring:
  application:
    name: stock-shield-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockshield}
    username: ${SPRING_DATASOURCE_USERNAME:stockshield}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme_pg_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ─── InfluxDB ───
influxdb:
  url: ${INFLUXDB_URL:http://localhost:8086}
  token: ${INFLUXDB_TOKEN:changeme_influx_token}
  org: ${INFLUXDB_ORG:stockshield}
  bucket: ${INFLUXDB_BUCKET:telemetry}

# ─── MQTT ───
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:stockshield-backend}
  qos: 1
  topics:
    weight: stockshield/shelf/+/weight
    environment: stockshield/shelf/+/environment
    status: stockshield/shelf/+/status

# ─── Alerts ───
alerts:
  check-interval-ms: 10000
  cooldown-minutes: 30
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-phone: ${TWILIO_FROM_PHONE:}
    to-phone: ${ALERT_PHONE:}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:alerts@stockshield.local}
    to-email: ${ALERT_EMAIL:admin@stockshield.local}

# ─── Logging ───
logging:
  level:
    com.stockshield: DEBUG
    org.eclipse.paho: WARN
    org.hibernate.SQL: WARN
